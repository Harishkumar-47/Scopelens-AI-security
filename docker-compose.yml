services:
  backend:
    image: scopelens-backend
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      AUDIT_DB: /code/data/evidence.sqlite3
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:0.6b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      DEMO_BANK_PIN: ${DEMO_BANK_PIN:-246810}
    mem_limit: 384m
    cpus: 1
    restart: unless-stopped
    volumes:
      - audit_data:/code/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 20s
      timeout: 3s
      retries: 5
  frontend:
    image: scopelens-frontend
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 20s
      timeout: 3s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
  ollama:
    image: ollama/ollama:latest
    profiles: ["live-model"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_MAX_QUEUE: 2
      OLLAMA_CONTEXT_LENGTH: 2048
      OLLAMA_KEEP_ALIVE: 60s
      OLLAMA_NO_CLOUD: "true"
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  audit_data:
  ollama_models:
