services:
  backend:
    image: scopelens-backend
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      AUDIT_DB: /code/data/evidence.sqlite3
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-240}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:0.6b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL:-http://llamacpp:8080}
      DEMO_BANK_PIN: ${DEMO_BANK_PIN:-246810}
    volumes:
      - audit_data:/code/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 20s
      timeout: 3s
      retries: 5
  frontend:
    image: scopelens-frontend
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
  ollama:
    image: ollama/ollama:latest
    profiles: ["live-model"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 3g
    cpus: 2
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["small-model"]
    command: ["-hf", "ggml-org/Qwen3-0.6B-GGUF:Q4_0", "--host", "0.0.0.0", "--port", "8080", "--alias", "qwen3-0.6b", "-c", "4096", "--jinja"]
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llama_models:/models
    ports:
      - "127.0.0.1:8081:8080"
volumes:
  audit_data:
  llama_models:
  ollama_models:
